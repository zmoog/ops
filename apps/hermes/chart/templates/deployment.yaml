apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Prevent two gateways sharing the same Discord token/auth store on upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: {{ printf "%s:%s@%s" .Values.image.repository .Values.image.tag .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          # Preserve the official entrypoint and its s6 initialization.
{{- if eq .Values.mode "bootstrap" }}
          args: ["sleep", "infinity"]
{{- else }}
          args: ["gateway", "run"]
{{- end }}
          workingDir: /opt/data
          securityContext:
            # s6 initializes as root; the image drops Hermes to UID/GID 10000.
            # Arbitrary runAsUser/readOnlyRootFilesystem break this image.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: HERMES_DASHBOARD
              value: "0"
            - name: API_SERVER_ENABLED
              value: "false"
            - name: TERMINAL_ENV
              value: local
            - name: DISCORD_ALLOW_ALL_USERS
              value: "false"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            - name: DISCORD_REQUIRE_MENTION
              value: "true"
            - name: DISCORD_ALLOWED_USERS
              value: {{ .Values.discord.allowedUsers | quote }}
            - name: DISCORD_FREE_RESPONSE_CHANNELS
              value: {{ .Values.discord.freeResponseChannels | quote }}
{{- if eq .Values.mode "gateway" }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName | quote }}
                  key: DISCORD_BOT_TOKEN
          # Process readiness only: this does not prove Discord/OpenAI connectivity.
          # s6 restarts a crashed gateway; avoid liveness checks against cloud services.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'test "$(/command/s6-svstat -o up /run/hermes-service/gateway-default)" = true'
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | quote }}
